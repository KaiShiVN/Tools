<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu TikTok Profile Multi-API</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 450px; background: #1e1e1e; padding: 24px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); border: 1px solid #333; }
        h2 { text-align: center; color: #fff; margin-top: 0; font-size: 22px; }
        .highlight { color: #ff0050; }
        .input-group { display: flex; gap: 8px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #00f2fe; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: linear-gradient(45deg, #ff0050, #00f2fe); color: #fff; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { opacity: 0.9; }
        .profile { margin-top: 20px; background: #252525; border-radius: 10px; padding: 16px; text-align: center; display: none; }
        .avatar { width: 90px; height: 90px; border-radius: 50%; border: 3px solid #ff0050; object-fit: cover; margin-bottom: 10px; }
        .nickname { font-size: 18px; font-weight: bold; margin: 5px 0; }
        .username { color: #aaa; font-size: 14px; margin-bottom: 12px; }
        .bio { font-size: 13px; color: #ddd; margin: 10px 0; padding: 8px; background: #1a1a1a; border-radius: 6px; word-break: break-word; }
        .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .stat-item { background: #1a1a1a; padding: 10px; border-radius: 8px; }
        .stat-val { font-weight: bold; font-size: 16px; color: #00f2fe; }
        .stat-lbl { font-size: 12px; color: #888; }
        .error { color: #ff5252; text-align: center; margin-top: 15px; display: none; font-size: 14px; }
        .loading { color: #00f2fe; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2>Tra Cứu TikTok <span class="highlight">Profile</span></h2>
    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Dán link hoặc nhập ID TikTok...">
        <button onclick="searchTikTok()">Tìm</button>
    </div>

    <div id="loading" class="loading">Đang kết nối hệ thống API đa máy chủ...</div>
    <div id="error" class="error"></div>

    <div id="profile" class="profile">
        <img id="avatar" class="avatar" src="" alt="Avatar">
        <div id="nickname" class="nickname"></div>
        <div id="username" class="username"></div>
        <div id="bio" class="bio"></div>
        <div class="stats">
            <div class="stat-item"><div id="followers" class="stat-val">0</div><div class="stat-lbl">Followers</div></div>
            <div class="stat-item"><div id="following" class="stat-val">0</div><div class="stat-lbl">Đang Follow</div></div>
            <div class="stat-item"><div id="likes" class="stat-val">0</div><div class="stat-lbl">Lượt Thích</div></div>
            <div class="stat-item"><div id="videos" class="stat-val">0</div><div class="stat-lbl">Video</div></div>
        </div>
    </div>
</div>

<script>
function extractUsername(input) {
    let clean = input.trim();
    if (clean.includes('tiktok.com/')) {
        const match = clean.match(/@([a-zA-Z0-9_.-]+)/);
        if (match && match[1]) return match[1];
        const parts = clean.split('/');
        clean = parts[parts.length - 1];
    }
    return clean.replace(/^@/, '').split('?')[0];
}

async function searchTikTok() {
    const rawInput = document.getElementById('usernameInput').value;
    const username = extractUsername(rawInput);
    
    const loading = document.getElementById('loading');
    const error = document.getElementById('error');
    const profile = document.getElementById('profile');

    if (!username) {
        showError("Vui lòng nhập ID hoặc dán link TikTok!");
        return;
    }

    loading.style.display = 'block';
    error.style.display = 'none';
    profile.style.display = 'none';

    // Danh sách 3 máy chủ API khác nhau
    const sources = [
        {
            url: `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://countik.com/api/user/info/${username}`)}`,
            parse: (data) => {
                if (data && data.status === 'success') {
                    return {
                        avatar: data.avatar,
                        nickname: data.nickname,
                        uniqueId: data.uniqueId || username,
                        bio: data.signature || 'Chưa cập nhật',
                        followers: data.followerCount,
                        following: data.followingCount,
                        likes: data.heartCount,
                        videos: data.videoCount
                    };
                }
                return null;
            }
        },
        {
            url: `https://corsproxy.io/?${encodeURIComponent(`https://www.tikwm.com/api/user/info?unique_id=${username}`)}`,
            parse: (data) => {
                if (data && data.code === 0 && data.data) {
                    const u = data.data.user;
                    const s = data.data.stats;
                    return {
                        avatar: u.avatarMedium || u.avatarThumb,
                        nickname: u.nickname,
                        uniqueId: u.uniqueId,
                        bio: u.signature || 'Chưa cập nhật',
                        followers: s.followerCount,
                        following: s.followingCount,
                        likes: s.heartCount,
                        videos: s.videoCount
                    };
                }
                return null;
            }
        },
        {
            url: `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://www.tiktok.com/oembed?url=https://www.tiktok.com/@${username}`)}`,
            parse: (data) => {
                if (data && data.author_name) {
                    return {
                        avatar: data.thumbnail_url,
                        nickname: data.author_name,
                        uniqueId: username,
                        bio: 'Không hỗ trợ xem tiểu sử ở server này',
                        followers: 'Ẩn',
                        following: 'Ẩn',
                        likes: 'Ẩn',
                        videos: 'Ẩn'
                    };
                }
                return null;
            }
        }
    ];

    let resultData = null;

    for (let src of sources) {
        try {
            const res = await fetch(src.url);
            if (!res.ok) continue;
            const json = await res.json();
            const parsed = src.parse(json);
            if (parsed) {
                resultData = parsed;
                break;
            }
        } catch (e) {
            console.log("Server lỗi, đang chuyển server tiếp theo...");
        }
    }

    if (resultData) {
        document.getElementById('avatar').src = resultData.avatar;
        document.getElementById('nickname').innerText = resultData.nickname;
        document.getElementById('username').innerText = '@' + resultData.uniqueId;
        document.getElementById('bio').innerText = resultData.bio;

        document.getElementById('followers').innerText = isNaN(resultData.followers) ? resultData.followers : Number(resultData.followers).toLocaleString('vi-VN');
        document.getElementById('following').innerText = isNaN(resultData.following) ? resultData.following : Number(resultData.following).toLocaleString('vi-VN');
        document.getElementById('likes').innerText = isNaN(resultData.likes) ? resultData.likes : Number(resultData.likes).toLocaleString('vi-VN');
        document.getElementById('videos').innerText = isNaN(resultData.videos) ? resultData.videos : Number(resultData.videos).toLocaleString('vi-VN');

        profile.style.display = 'block';
    } else {
        showError(`Không tìm thấy tài khoản "${username}". Bạn vui lòng kiểm tra lại chính xác ID TikTok nhé!`);
    }

    loading.style.display = 'none';
}

function showError(msg) {
    const error = document.getElementById('error');
    error.innerText = msg;
    error.style.display = 'block';
}
</script>

</body>
</html>
