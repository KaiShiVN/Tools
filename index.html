<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu TikTok Profile</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
        .card { width: 100%; max-width: 480px; background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #333; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #fff; margin-top: 0; font-size: 22px; }
        .highlight { color: #ff0050; }
        .input-group { display: flex; gap: 8px; margin: 15px 0; }
        input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; font-size: 15px; outline: none; }
        input:focus { border-color: #00f2fe; }
        button { padding: 12px 20px; border-radius: 8px; border: none; background: linear-gradient(45deg, #ff0050, #00f2fe); color: #fff; font-weight: bold; cursor: pointer; font-size: 15px; }
        button:hover { opacity: 0.9; }
        .embed-container { margin-top: 20px; width: 100%; display: none; border-radius: 10px; overflow: hidden; background: #000; }
        iframe { width: 100%; height: 580px; border: none; border-radius: 10px; }
        .error { color: #ff5252; text-align: center; margin-top: 15px; display: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="card">
    <h2>Tra Cứu TikTok <span class="highlight">Profile</span></h2>
    <div class="input-group">
        <input type="text" id="usernameInput" placeholder="Nhập ID (VD: vtv24news, khaby.lame)...">
        <button onclick="searchTikTok()">Tìm</button>
    </div>

    <div id="error" class="error"></div>
    
    <div id="embedContainer" class="embed-container">
        <iframe id="tiktokIframe" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
function extractUsername(input) {
    let clean = input.trim();
    if (clean.includes('tiktok.com/')) {
        const match = clean.match(/@([a-zA-Z0-9_.-]+)/);
        if (match && match[1]) return match[1];
        const parts = clean.split('/');
        clean = parts[parts.length - 1];
    }
    return clean.replace(/^@/, '').split('?')[0];
}

function searchTikTok() {
    const rawInput = document.getElementById('usernameInput').value;
    const username = extractUsername(rawInput);
    const container = document.getElementById('embedContainer');
    const iframe = document.getElementById('tiktokIframe');
    const error = document.getElementById('error');

    if (!username) {
        error.innerText = "Vui lòng nhập ID hoặc link TikTok!";
        error.style.display = 'block';
        container.style.display = 'none';
        return;
    }

    error.style.display = 'none';
    // Sử dụng Embed Player chính thức của TikTok (không qua proxy, không lo lỗi CORS/Cloudflare)
    iframe.src = `https://www.tiktok.com/embed/v2/@${username}?lang=vi-VN`;
    container.style.display = 'block';
}
</script>

</body>
</html>
